<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #f7f7f2;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #111827;
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
        background-image:
          linear-gradient(to right, #e7e9e4 1px, transparent 1px),
          linear-gradient(to bottom, #e7e9e4 1px, transparent 1px);
        background-size: 72px 72px;
      }
      .rule {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 72px;
        height: 1px;
        background: #e7e9e4;
      }
      /* Same lockup proportions as src/components/brand/Logo.tsx at 1.6x:
         mark height 48, wordmark 27, gap 5, endorsement 16. */
      .lockup {
        position: absolute;
        left: 72px;
        top: 92px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .lockup img {
        display: block;
        height: 48px;
        width: auto;
      }
      .lockup-text {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .wordmark {
        font-size: 27px;
        font-weight: 600;
        letter-spacing: -0.022em;
        line-height: 1;
      }
      .endorsement {
        font-size: 16px;
        font-weight: 400;
        line-height: 1;
        color: #475569;
      }
      .endorsement span {
        font-weight: 500;
        color: #1f2937;
      }
      .endorsement span b {
        font-weight: 500;
        color: #0f766e;
      }
      .eyebrow {
        position: absolute;
        left: 72px;
        top: 188px;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #475569;
        font-weight: 500;
      }
      h1 {
        position: absolute;
        left: 72px;
        top: 218px;
        margin: 0;
        max-width: 720px;
        font-size: 64px;
        line-height: 0.98;
        letter-spacing: -0.035em;
        font-weight: 600;
      }
      p {
        position: absolute;
        left: 72px;
        bottom: 88px;
        margin: 0;
        max-width: 640px;
        font-size: 20px;
        line-height: 1.45;
        color: #475569;
      }
      .meta {
        position: absolute;
        right: 72px;
        bottom: 88px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #475569;
        text-align: right;
      }
      .spine {
        position: absolute;
        right: 168px;
        top: 168px;
        width: 2px;
        height: 280px;
        background: #12372a;
      }
      .node {
        position: absolute;
        right: 164px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #20a779;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="rule"></div>
      <div class="lockup">
        <img src="../src/assets/brand/mark.png" alt="" />
        <div class="lockup-text">
          <div class="wordmark">OpportunityPedia</div>
          <div class="endorsement">
            Powered by <span>Opportunity<b>X</b></span>
          </div>
        </div>
      </div>
      <div class="eyebrow">Opportunity intelligence company</div>
      <h1>We make opportunity easier to see.</h1>
      <p>Intelligence products that turn fragmented market signals into clear opportunities for action.</p>
      <div class="meta">Flagship / OpportunityX<br />IDX / 0347</div>
      <div class="spine"></div>
      <div class="node" style="top: 210px"></div>
      <div class="node" style="top: 268px"></div>
      <div class="node" style="top: 326px"></div>
      <div class="node" style="top: 384px"></div>
    </div>
  </body>
</html>
